{% extends "facturacion/base.html" %}

{% block titulo %}Iniciar sesión · {{ NOMBRE_SISTEMA }}{% endblock %}

{% block contenido %}
<div class="login-caja">
  <div class="card login-card">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="login-logo"><i class="bi bi-receipt-cutoff"></i></div>
        <h1 class="h4 fw-bold mb-1">{{ NOMBRE_SISTEMA }}</h1>
        <p class="text-secondary small mb-0">Ingresa tus credenciales para continuar</p>
      </div>

      {% if form.non_field_errors %}
        <div class="alert alert-danger small">{{ form.non_field_errors.0 }}</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label" for="id_username">Usuario</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input class="form-control" type="text" name="username" id="id_username"
                   value="{{ form.username.value|default:'' }}" required autofocus>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label" for="id_password">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input class="form-control" type="password" name="password" id="id_password" required>
          </div>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary w-100 py-2">Entrar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
